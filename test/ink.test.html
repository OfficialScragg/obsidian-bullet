<!doctype html>
<html><head><meta charset="utf-8"><title>ink test</title>
<style>
 html,body{margin:0;background:#0b0c0f;color:#ddd;font:12px monospace}
 #stage{position:fixed;top:0;left:0;width:600px;height:700px}
 #out{white-space:pre;padding:8px;position:relative;z-index:2}
</style></head>
<body>
<pre id="out">running…</pre>
<div id="stage"></div>
<script type="module">
// --- minimal polyfills for the Obsidian DOM helpers InkLayer uses ----------
Object.assign(HTMLElement.prototype, {
  createEl(tag, o = {}) {
    const el = document.createElement(tag);
    if (o.cls) el.className = o.cls;
    if (o.text) el.textContent = o.text;
    this.appendChild(el);
    return el;
  },
  toggleClass(cls, on) { this.classList.toggle(cls, !!on); },
  addClass(cls) { this.classList.add(cls); },
  empty() { this.replaceChildren(); },
});

import { InkLayer } from './inklayer.mjs';
import { encodeInk, decodeInk } from './ink.mjs';

const log = [];
let failures = 0;
const paint = () => { document.getElementById('out').textContent = log.join('\n'); };
window.onerror = (m, f, l) => { log.push('ERROR: ' + m + ' @' + l); paint(); };
window.onunhandledrejection = (e) => { log.push('REJECT: ' + (e.reason?.stack || e.reason)); paint(); };
const check = (name, got, want) => {
  const ok = JSON.stringify(got) === JSON.stringify(want);
  if (!ok) failures++;
  log.push(`${ok ? 'PASS' : 'FAIL'}  ${name}` + (ok ? '' : `  got=${JSON.stringify(got)} want=${JSON.stringify(want)}`));
  paint();
};
const near = (name, got, want, tol) => {
  const ok = Math.abs(got - want) <= tol;
  if (!ok) failures++;
  log.push(`${ok ? 'PASS' : 'FAIL'}  ${name}  got=${got.toFixed?.(2) ?? got} want≈${want}±${tol}`);
  paint();
};

const stage = document.getElementById('stage');
let changes = 0;
const ink = new InkLayer(stage, {
  fingerDraw: false, color: '#c9a227', width: 2.4, maxDpr: 2,
  onChange: () => { changes++; },
});
ink.observe(stage, null);
ink.setMode('draw');

const canvas = ink.canvas;
let pid = 1;
function send(type, x, y, opts = {}) {
  canvas.dispatchEvent(new PointerEvent(type, {
    pointerId: opts.id ?? pid, pointerType: opts.type ?? 'pen',
    clientX: x, clientY: y, pressure: opts.pressure ?? 0.5,
    buttons: opts.buttons !== undefined ? opts.buttons : (type === 'pointerup' ? 0 : 1),
    bubbles: true, cancelable: true, isPrimary: true,
  }));
}
// pointerup force-flushes any pending points, so the test does not need to
// wait on rAF (which headless virtual time does not drive reliably).
const frame = () => new Promise(r => setTimeout(r, 0));

// --- a stroke: down, several moves, up ------------------------------------
async function drawLine(y, n = 30, id = pid) {
  send('pointerdown', 100, y, { id });
  for (let i = 1; i <= n; i++) {
    send('pointermove', 100 + i * 8, y, { id });
    if (i % 5 === 0) await frame();
  }
  await frame();
  send('pointerup', 100 + n * 8, y, { id });
}

(async () => {
 try {
  const t0 = performance.now();
  await drawLine(200);
  check('one stroke recorded', ink.getStrokes().length, 1);

  const pts = ink.getStrokes()[0].points;
  check('stroke keeps its points', pts.length > 25 && pts.length <= 31, true);
  const toInk = px => px / (stage.clientWidth / 1000);
  near('first point x maps to ink space', pts[0].x, toInk(100), 2);
  near('last point x maps to ink space', pts[pts.length - 1].x, toInk(340), 4);
  check('save fired once per stroke', changes, 1);

  // a lifted pen must start a separate stroke, not extend the last one
  pid = 2;
  await drawLine(300, 20, 2);
  check('lifting the pen ends the stroke', ink.getStrokes().length, 2);
  check('second stroke is its own', ink.getStrokes()[1].points.length > 15, true);
  check('save fired again', changes, 2);

  // undo / redo
  ink.undo();
  check('undo removes a stroke', ink.getStrokes().length, 1);
  ink.redo();
  check('redo restores it', ink.getStrokes().length, 2);

  // a finger must not draw when fingerDraw is off
  const before = ink.getStrokes().length;
  send('pointerdown', 500, 400, { id: 9, type: 'touch' });
  send('pointermove', 520, 400, { id: 9, type: 'touch' });
  await frame();
  send('pointerup', 520, 400, { id: 9, type: 'touch' });
  check('finger does not draw', ink.getStrokes().length, before);

  // round trip through the stored format
  const encoded = encodeInk(ink.getStrokes(), true);
  const decoded = decodeInk(encoded);
  check('round trip keeps stroke count', decoded.length, ink.getStrokes().length);
  check('round trip keeps point count',
    decoded.map(s => s.points.length), ink.getStrokes().map(s => s.points.length));
  near('round trip keeps geometry', decoded[0].points[3].x, ink.getStrokes()[0].points[3].x, 0.11);
  check('ink space is width independent', Math.round(pts[pts.length-1].x) <= 1000, true);

  // a tap with no movement must still leave a mark
  const beforeTap = ink.getStrokes().length;
  send('pointerdown', 300, 100, { id: 30 });
  send('pointerup', 300, 100, { id: 30 });
  check('tap leaves a dot', ink.getStrokes().length, beforeTap + 1);
  check('the dot kept its point', ink.getStrokes()[ink.getStrokes().length-1].points.length, 1);

  // erase
  ink.setMode('erase');
  const beforeErase = ink.getStrokes().length;
  send('pointerdown', 100 + 5 * 8, 200, { id: 20 });
  await frame();
  send('pointerup', 100 + 5 * 8, 200, { id: 20 });
  check('eraser removes the stroke under it', ink.getStrokes().length, beforeErase - 1);

  // and leaves everything else alone
  ink.setMode('draw');
  const beforeMiss = ink.getStrokes().length;
  ink.setMode('erase');
  send('pointerdown', 560, 60, { id: 21 });
  send('pointerup', 560, 60, { id: 21 });
  check('eraser misses empty space', ink.getStrokes().length, beforeMiss);

  // --- a palm landing mid-stroke must not disturb the pen -----------------
  ink.setMode('draw');
  const strokesBeforePalm = ink.getStrokes().length;
  send('pointerdown', 100, 250, { id: 50 });
  send('pointermove', 140, 250, { id: 50 });
  await frame();

  // the hand settles on the glass while the pen is still writing
  send('pointerdown', 400, 420, { id: 51, type: 'touch' });
  send('pointermove', 402, 424, { id: 51, type: 'touch' });
  await frame();

  // the pen carries on
  send('pointermove', 180, 250, { id: 50 });
  send('pointermove', 220, 250, { id: 50 });
  await frame();
  send('pointerup', 402, 424, { id: 51, type: 'touch' });
  send('pointerup', 220, 250, { id: 50 });

  check('palm does not break the stroke', ink.getStrokes().length, strokesBeforePalm + 1);
  const palmStroke = ink.getStrokes()[ink.getStrokes().length - 1];
  check('pen kept drawing through the palm', palmStroke.points.length >= 4, true);
  check('the stroke reached its end', Math.round(palmStroke.points[palmStroke.points.length-1].x), Math.round(toInk(220)));
  check('the canvas kept pointer events', canvas.style.pointerEvents, 'auto');

  // --- a stroke whose pointerdown never arrived must still draw -----------
  ink.setMode('draw');
  const beforeLost = ink.getStrokes().length;
  // no pointerdown at all: the pen is simply already on the glass and moving
  send('pointermove', 300, 300, { id: 60, buttons: 1 });
  send('pointermove', 340, 300, { id: 60, buttons: 1 });
  send('pointermove', 380, 300, { id: 60, buttons: 1 });
  await frame();
  send('pointerup', 380, 300, { id: 60 });
  check('a stroke with no pointerdown is recovered', ink.getStrokes().length, beforeLost + 1);
  check('the recovered stroke has its points',
    ink.getStrokes()[ink.getStrokes().length - 1].points.length >= 2, true);

  // a hovering pen (no contact) must not start anything
  const beforeHover = ink.getStrokes().length;
  send('pointermove', 300, 350, { id: 61, buttons: 0 });
  send('pointermove', 340, 350, { id: 61, buttons: 0 });
  await frame();
  check('a hovering pen does not draw', ink.getStrokes().length, beforeHover);

  const beforeOutside = ink.getStrokes().length;
  send('pointermove', 900, 100, { id: 62, buttons: 1 });
  await frame();
  check('a pen outside the canvas does not draw', ink.getStrokes().length, beforeOutside);

  // --- the incremental encoding cache must match a full encode -----------
  const full = () => encodeInk(ink.getStrokes(), true);
  check('cached encoding matches a full encode', ink.encodedInk(true), full());

  ink.setMode('draw');
  pid = 3;
  await drawLine(150, 12, 3);
  check('cache appends a new stroke correctly', ink.encodedInk(true), full());

  ink.undo();
  check('cache is rebuilt after undo', ink.encodedInk(true), full());

  ink.setMode('erase');
  send('pointerdown', 300, 100, { id: 40 });
  send('pointerup', 300, 100, { id: 40 });
  check('cache is rebuilt after erase', ink.encodedInk(true), full());

  ink.setMode('draw');
  pid = 4;
  await drawLine(170, 10, 4);
  check('cache still correct after a rebuild then append', ink.encodedInk(true), full());

  // --- a canvas that moved without resizing must still take the pen -------
  ink.setMode('draw');
  const beforeMove = ink.getStrokes().length;
  // shift the stage: same size, new position, no resize notification
  stage.style.top = '100px';
  send('pointerdown', 200, 160, { id: 70 });
  send('pointermove', 240, 160, { id: 70 });
  send('pointermove', 280, 160, { id: 70 });
  await frame();
  send('pointerup', 280, 160, { id: 70 });
  check('a moved canvas still draws', ink.getStrokes().length, beforeMove + 1);
  const moved = ink.getStrokes()[ink.getStrokes().length - 1];
  check('the moved stroke lands in the right place',
    Math.round(moved.points[0].y), Math.round((160 - 100) / (stage.clientWidth / 1000)));
  stage.style.top = '0px';

  // --- the pointer log must record what actually happened ----------------
  const trace = ink.getTrace().join('\n');
  check('pointer log records stroke starts', /stroke start/.test(trace), true);
  check('pointer log records commits', /stroke committed/.test(trace), true);
  check('pointer log records rejected palms', /palm|pan start/.test(trace), true);
  check('pointer log is bounded', ink.getTrace().length <= 120, true);

  // --- cost of the old per-point layout read vs the cached origin ---------
  const N = 2000;
  let sink = 0;
  const a = performance.now();
  for (let i = 0; i < N; i++) sink += canvas.getBoundingClientRect().left;
  const rectMs = performance.now() - a;
  const b = performance.now();
  for (let i = 0; i < N; i++) sink += canvas.width;
  const cachedMs = performance.now() - b;

  log.push('');
  log.push(`getBoundingClientRect x${N}: ${rectMs.toFixed(1)} ms  (${(rectMs / N * 1000).toFixed(1)} us each)`);
  log.push(`cached read x${N}:            ${cachedMs.toFixed(1)} ms`);
  log.push(`total test time: ${(performance.now() - t0).toFixed(0)} ms  sink=${sink > 0 ? 'ok' : 'ok'}`);
  log.push('');
  log.push(failures === 0 ? 'ALL PASS' : `${failures} FAILURE(S)`);
  paint();
 } catch (err) { log.push('THREW: ' + (err?.stack || err)); paint(); }
})();
</script>
</body></html>
